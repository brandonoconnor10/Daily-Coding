<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Multimedia Player</title>
</head>
<body>
  <h1>My Multimedia Player</h1>

  <section>
    <h2>Sailing Away</h2>
    <audio controls aria-label="Audio track: Sailing Away">
      <source src="https://cdn.freecodecamp.org/curriculum/js-music-player/sailing-away.mp3" type="audio/mpeg">

  </section>

  <section>

    <video controls width="600" aria-label="Video: What is the map method and how does it work">

      <track src="https://cdn.freecodecamp.org/curriculum/labs/what-is-the-map-method-and-how-does-it-work.vtt" kind="subtitles" srclang="en" label="English">
    </video>
  </section>

  <section>
    <h2>Transcript</h2>
    <p>The map method is a powerful array function in JavaScript that allows you to transform elements of an array by applying a function to each element, returning a new array with the transformed values.</p>
