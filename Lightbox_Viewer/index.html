<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lightbox Viewer</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <body>
  <!-- Gallery -->
  <div class="gallery">
    <img
      src="https://cdn.freecodecamp.org/curriculum/labs/stonehenge-thumbnail.jpg"
      class="gallery-item"
      alt="Stonehenge"
    />
    <img
      src="https://cdn.freecodecamp.org/curriculum/labs/storm-thumbnail.jpg"
      class="gallery-item"
      alt="Storm"
    />
    <img
      src="https://cdn.freecodecamp.org/curriculum/labs/trees-thumbnail.jpg"
      class="gallery-item"
      alt="Trees"
    />
  </div>

  <!-- Lightbox -->
  <div class="lightbox">
    <button id="close-btn">&times;</button>
    <img id="lightbox-image" alt="Full size preview" />
  </div>

  <script src="script.js"></script>

</html>
