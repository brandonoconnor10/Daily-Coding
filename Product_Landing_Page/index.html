<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Product Landing Page</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Header -->
  <header id="header">
    <img id="header-img" src="https://upload.wikimedia.org/wikipedia/commons/a/a7/React-icon.svg" alt="Logo">
    <nav id="nav-bar">
      <a class="nav-link" href="#features">Features</a>
      <a class="nav-link" href="#video-section">Demo</a>
      <a class="nav-link" href="#signup">Sign Up</a>
    </nav>
  </header>

  <!-- Main Content -->
  <main>
    <section id="features">
      <h2>Features</h2>
      <p>Our product is designed with simplicity and performance in mind.</p>
      <p>Built using modern web technologies, it ensures speed and reliability.</p>
      <p>Responsive design makes it look great on any device.</p>
    </section>

    <section id="video-section">
      <h2>Product Demo</h2>
      <iframe id="video" width="560" height="315" src="https://www.youtube.com/embed/dQw4w9WgXcQ" 
        title="Product Demo" frameborder="0" allowfullscreen></iframe>
    </section>

    <section id="signup">
      <h2>Stay Updated</h2>
      <form id="form" action="https://www.freecodecamp.org/email-submit">
        <input id="email" name="email" type="email" placeholder="Enter your email" required>
        <input id="submit" type="submit" value="Subscribe">
      </form>
    </section>
  </main>
</body>
</html>
