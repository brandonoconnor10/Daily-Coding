<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stylized To-Do-List</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="ToDoList-Container">
    <ul class="todo-list">
         <h1>My To-Do-List</h1>
    <li>
      <input type="checkbox" id="task1">
      <label for="task1">Buy groceries</label>
      <ul class="sub-item">
        <li><a class="sub-item-link" href="#" target="_blank">Grocery List</a></li>
      </ul>
    </li>
    <li>
      <input type="checkbox" id="task2">
      <label for="task2">Finish homework</label>
      <ul class="sub-item">
        <li><a class="sub-item-link" href="#" target="_blank">Homework Guide</a></li>
      </ul>
    </li>
    <li>
      <input type="checkbox" id="task3">
      <label for="task3">Clean the house</label>
      <ul class="sub-item">
        <li><a class="sub-item-link" href="#" target="_blank">Cleaning Tips</a></li>
      </ul>
    </li>
    <li>
      <input type="checkbox" id="task4">
      <label for="task4">Exercise</label>
      <ul class="sub-item">
        <li><a class="sub-item-link" href="#" target="_blank">Workout Plan</a></li>
      </ul>
    </li>
  </ul>
    </div>
 
</body>
</html>
