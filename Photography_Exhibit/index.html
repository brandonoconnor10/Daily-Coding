<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Photography Exhibit</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body>
    <div class="main-container grid grid-cols-3 gap-6 p-6">
  <!-- Card 1 -->
  <div class="card rounded-lg p-4 shadow-md bg-white">
    <img
      src="https://cdn.freecodecamp.org/curriculum/labs/colosseo.jpg"
      alt="Colosseum in Rome"
      class="rounded-md mb-3"
    />
    <div class="subheading font-bold text-xl mb-2">Colosseum</div>
    <div class="description text-base text-gray-700">
      A timeless monument in Rome, showcasing ancient architecture and history.
    </div>
  </div>

  <!-- Card 2 -->
  <div class="card rounded-lg p-4 shadow-md bg-white">
    <img
      src="https://cdn.freecodecamp.org/curriculum/labs/alps.jpg"
      alt="Snowy Alps"
      class="rounded-md mb-3"
    />
    <div class="subheading font-semibold text-lg mb-2">Alps</div>
    <div class="description text-sm text-gray-700">
      Majestic snowy peaks offering breathtaking views and serene landscapes.
    </div>
  </div>

  <!-- Card 3 -->
  <div class="card rounded-lg p-4 shadow-md bg-white">
    <img
      src="https://cdn.freecodecamp.org/curriculum/labs/sea.jpg"
      alt="Sea waves"
      class="rounded-md mb-3"
    />
    <div class="subheading font-bold text-xl mb-2">Sea</div>
    <div class="description text-base text-gray-700">
      Gentle waves and endless horizons, capturing the calm of the ocean.
    </div>
  </div>
</div>

  </body>
</html>
