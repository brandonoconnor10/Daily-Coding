<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Business Card</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="business-card">
        <img src="https://cdn.freecodecamp.org/curriculum/labs/flower.jpg" alt="image of a pink flower" class="profile-image">
        <p class="full-name">Your Name</p>
        <p class="designation">Frontend Developer</p>
        <p class="company">@freeCodeCamp</p>
        <hr>
        <p>Email: fakeEmail@gmail.com</p>
        <p>Phone: 123-456-789</p>
        <a href="#" class="portfolio-link">Portfolio</a>
        <hr>
        <div class="social-media">
            <h2>Connect with me</h2>
            <a href="#">Twitter</a>
            <a href="#">LinkedIn</a>
            <a href="#">GitHub</a>
        </div>
    </div>
</body>
</html>
